<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Sync Project</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <script src="static/js/links.js" defer></script>
</head>
<body>
    <header>
        <h1>Link Sync Project</h1>
    </header>
    <main>
        <section id="game-selection">
            <h2>Select a Game</h2>
            <button id="game1" onclick="fetchLinks('game1')">Game 1</button>
            <button id="game2" onclick="fetchLinks('game2')">Game 2</button>
            <!-- Add more game buttons as needed -->
        </section>
        <section id="links-display">
            <h2>Extracted Links</h2>
            <ul id="links-list"></ul>
            <button id="copy-links" onclick="copyLinks()">Copy Links</button>
            <button id="download-links" onclick="downloadLinks()">Download links.txt</button>
        </section>
        <section id="message-display">
            <p id="message"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Link Sync Project</p>
    </footer>
</body>
</html>
