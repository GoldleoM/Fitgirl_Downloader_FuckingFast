<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="600" cy="240" r="220" fill="rgba(0, 242, 254, 0.12)" filter="url(#glow)" />
  <circle cx="750" cy="300" r="180" fill="rgba(138, 43, 226, 0.12)" filter="url(#glow)" />

  <!-- App Icon Box -->
  <g transform="translate(540, 110)">
    <rect width="120" height="120" rx="28" fill="url(#cyanPurple)" filter="url(#glow)" />
    <path d="M68 35L42 70H60L52 95L78 60H60L68 35Z" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <text x="600" y="300" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-1">
    FIT<tspan fill="url(#neonGlow)">BOY</tspan> PRO
  </text>

  <!-- Subheading / Value Proposition -->
  <text x="600" y="365" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="24" fill="#94a3b8" letter-spacing="0.5">
    High-Speed PC Game Library &amp; Download Manager Utility
  </text>

  <!-- Features Badge Row -->
  <g transform="translate(600, 440)">
    <!-- Badge 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-20" width="200" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00f2fe">⚡ 3,200+ Games</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(0, 0)">
      <rect x="-120" y="-20" width="240" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00ff87">🚀 1-Click FDM Batch</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(320, 0)">
      <rect x="-100" y="-20" width="200" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#a855f7">💎 Lossless Archive</text>
    </g>
  </g>

  <!-- Footer Domain Info -->
  <text x="600" y="555" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#64748b" letter-spacing="1">
    fitboy-0.web.app • Open Source by @GoldleoM
  </text>
</svg>